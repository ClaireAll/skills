interface:
  display_name: "Bug Description Writer"
  short_description: "Draft and publish concise colored Chinese Feishu bug comments."
  default_prompt: "Use $bug-des to create a concise, natural Chinese Feishu bug comment with exactly three headings: 原因、改动内容、可能导致的问题. Keep the cause to 1-2 sentences, list every independently meaningful change as its own short bullet, and keep each change or risk bullet to one sentence without source file names or implementation steps. When publishing to Feishu, first keep one plain fallback comment, then edit that same comment through browser rich-text clipboard paste so the headings and labels use the skill's colors while body text stays 14px and normal weight. Preserve the fallback if rich-text verification fails."
