interface:
  display_name: "Bug Description Writer"
  short_description: "Draft and publish concise colored Chinese Feishu bug comments."
  default_prompt: "Use $bug-des to create a natural Chinese Feishu bug comment with exactly three headings: 原因、改动内容、可能导致的问题. When publishing to Feishu, first keep one plain fallback comment, then edit that same comment through browser rich-text clipboard paste so the headings and labels use the skill's colors while body text stays 14px and normal weight. Preserve the fallback if rich-text verification fails. State the evidence-backed Bug cause first, keep source file names out, include every independently meaningful final-diff behavior change, and write each supported residual risk only as one concrete scenario with its possible result."
