interface:
  display_name: "Bug Description Writer"
  short_description: "Draft and publish concise Chinese Feishu bug comments through MCP."
  default_prompt: "Use $bug-des to create a concise, natural Chinese Feishu bug comment with 原因 and 改动内容 first. Use 可能导致的问题 for concrete supported risks; otherwise use 影响的场景 for supported direct effects, or omit the final section if neither is supported. Keep the cause to 1-2 sentences, list every independently meaningful change as its own short bullet, and keep each change, risk, or affected-scenario bullet to one sentence without source file names or implementation steps. When publishing to Feishu, use Feishu Project MCP directly with plain text or supported Markdown, without custom colors or browser formatting. Verify saved content and check for an existing write before retrying an unclear result."
